; PHP settings for the WordPress container (mounted into conf.d).
;
; php2shell (CVE-2026-109618 / CVE-2026-109619, October 2026): the leaked
; exploit is reported to use session upload progress. Nothing here needs
; it, so it stays off whether or not PHP is patched.
session.upload_progress.enabled = Off

; No version banner in responses.
expose_php = Off
