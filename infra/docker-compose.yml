# Bene Vixit shop stack — WordPress + WooCommerce + CipherPay behind Caddy.
# Deliberately minimal: no Node API, no deploy webhook. The gate lives on
# Cloudflare Workers; this box only sells the hat.

# Container logs are capped: request lines carry order keys and one-time
# grant tokens, and Docker otherwise keeps every line forever.
x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The origin lock (see Caddyfile): only requests carrying this token,
      # which the Worker adds, are served.
      - BV_PROXY_TOKEN=${BV_PROXY_TOKEN:-}
    logging: *logging
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - wordpress
    networks:
      - frontend

  wordpress:
    image: wordpress:6-php8.2-apache
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_NAME=${DB_NAME}
      - WORDPRESS_DB_USER=${DB_USER}
      - WORDPRESS_DB_PASSWORD=${DB_PASSWORD}
      # wp-config.php extras: the grant secret, and the public URL — WordPress
      # is served same-origin through the benevixit.com Worker, so every URL
      # it generates must say benevixit.com, not shop.benevixit.com.
      - WORDPRESS_CONFIG_EXTRA=define('BV_GRANT_SECRET', getenv('BV_GRANT_SECRET')); define('WP_HOME', 'https://benevixit.com'); define('WP_SITEURL', 'https://benevixit.com');
      - BV_GRANT_SECRET=${BV_GRANT_SECRET}
    volumes:
      - wordpress_data:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ../theme:/var/www/html/wp-content/themes/benevixit
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend

  db:
    image: mariadb:11
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME}
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  wordpress_data:
  db_data:

networks:
  frontend:
  backend:
    internal: true
